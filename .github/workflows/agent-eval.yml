name: Agent eval

# Run from the Actions tab before merging a change to the agent's prompt, rules or model:
# the agent answers every case in evaluation/agent with the real model (mock actions only).
# It costs model tokens, so it never runs on its own.
on:
  workflow_dispatch:
    inputs:
      models:
        description: Models to compare, space separated (empty = the production agent)
        type: string
        default: ''
      reasoning:
        description: Reasoning effort for those models (none, low, medium)
        type: string
        default: ''
      repeat:
        description: Runs per case
        type: string
        default: '3'

permissions:
  contents: read

jobs:
  eval:
    name: Agent eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run the eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_BACKUP_MODEL: ${{ vars.AGENT_BACKUP_MODEL }}
          AGENT_REASONING_EFFORT: ${{ vars.AGENT_REASONING_EFFORT }}
          AGENT_PRICES: ${{ vars.AGENT_PRICES }}
          MODELS: ${{ inputs.models }}
          REASONING: ${{ inputs.reasoning }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          [[ -n "$OPENAI_API_KEY" ]] || { echo 'OPENAI_API_KEY is not set'; exit 1; }
          # The toolchain container reads .env: hand it the settings of this run.
          {
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"
            for v in AGENT_MODEL AGENT_BACKUP_MODEL AGENT_REASONING_EFFORT AGENT_PRICES; do
              if [[ -n "${!v}" ]]; then echo "$v=${!v}"; fi
            done
          } > .env
          args=(--repeat "${REPEAT:-3}")
          for m in $MODELS; do args+=(--model "$m"); done
          if [[ -n "$REASONING" ]]; then args+=(--reasoning "$REASONING"); fi
          ./dev callora eval "${args[@]}" | tee eval.txt
          { echo '```'; cat eval.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          rm -f .env
          ./dev clean
