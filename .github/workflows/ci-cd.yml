name: Callora CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  # Run from the Actions tab:
  # - bootstrap: prepare and validate the VM without deploying (safe on a live server);
  # - deploy: a full release of main;
  # - reset: remove the legacy Callora deployment (containers, images, database volume,
  #   files; never other stacks or Caddy's certificates), then bootstrap and deploy clean.
  workflow_dispatch:
    inputs:
      mode:
        description: What to run against production
        type: choice
        options: [bootstrap, deploy, reset]
        default: bootstrap
      confirm_reset:
        description: For reset only, type DELETE-LEGACY-CALLORA
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: callora-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ${{ vars.DOCKER_HUB_USERNAME }}/callora

jobs:
  # Only on pull requests for now: deploys skip it to ship faster, and `./dev check` runs
  # locally before each commit instead.
  quality:
    name: Format, lint, test and validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # The same containerized toolchain developers use: rustfmt, clippy -D warnings and
      # the whole test suite against a real PostgreSQL.
      - name: fmt, clippy and tests (./dev check)
        run: ./dev check

      - name: Validate business configuration
        run: ./dev callora config validate

      - name: Validate deployment configuration
        env:
          CALLORA_IMAGE: validation/callora:0000000000000000000000000000000000000000
          POSTGRES_USER: callora
          POSTGRES_PASSWORD: validation-only
          POSTGRES_DB: callora
          DATABASE_URL: postgresql://callora:validation-only@db:5432/callora
          PUBLIC_BASE_URL: https://callora.example.invalid
          TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
          TWILIO_AUTH_TOKEN: validation-only
        run: |
          bash -n deploy/deploy.sh deploy/bootstrap-oracle-linux.sh
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q

      - name: Stop the development stack
        if: always()
        run: ./dev clean

  image:
    name: Publish ARM64 image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'deploy' || inputs.mode == 'reset')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Docker Hub configuration
        env:
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          [[ -n "$DOCKER_HUB_USERNAME" ]] || { echo 'Missing Repository Variable DOCKER_HUB_USERNAME' >&2; exit 1; }
          [[ -n "$DOCKER_HUB_TOKEN" ]] || { echo 'Missing Repository Secret DOCKER_HUB_TOKEN' >&2; exit 1; }
          [[ "$DOCKER_HUB_USERNAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || { echo 'DOCKER_HUB_USERNAME is not a valid namespace' >&2; exit 1; }

      # The Dockerfile cross-compiles on the runner's own architecture, so QEMU is only
      # needed for the (RUN-free) final stage metadata.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  host:
    name: Bootstrap and validate the production VM
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SERVER_HOST: ${{ secrets.IP }}
      SERVER_USER: ${{ secrets.USER }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check reset confirmation
        if: inputs.mode == 'reset'
        env:
          CONFIRM: ${{ inputs.confirm_reset }}
        run: |
          [[ "$CONFIRM" == 'DELETE-LEGACY-CALLORA' ]] || { echo 'reset needs confirm_reset=DELETE-LEGACY-CALLORA' >&2; exit 1; }

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.KEY_PEM }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: deploy/ci-ssh-setup.sh

      # Idempotent: installs Docker on a fresh Oracle Linux 9 VM, only verifies an existing one.
      - name: Bootstrap the host (Docker, firewall, /opt/callora)
        run: |
          source "$SSH_DIR/ssh.env"
          "${SCP[@]}" deploy/bootstrap-oracle-linux.sh "$REMOTE:/tmp/callora-bootstrap.sh"
          "${SSH[@]}" "$REMOTE" "sudo -n bash /tmp/callora-bootstrap.sh '$SERVER_USER' && rm -f /tmp/callora-bootstrap.sh"

      # New SSH session, so a docker group membership added above applies.
      - name: Create or verify host-only settings
        env:
          MODE: ${{ inputs.mode }}
        run: |
          source "$SSH_DIR/ssh.env"
          "${SCP[@]}" deploy/deploy.sh "$REMOTE:/opt/callora/incoming/deploy.sh"
          "${SSH[@]}" "$REMOTE" 'install -m 0755 /opt/callora/incoming/deploy.sh /opt/callora/deploy.sh'
          if [[ "$MODE" == 'reset' ]]; then
            "${SSH[@]}" "$REMOTE" 'bash /opt/callora/deploy.sh purge-legacy I-UNDERSTAND-THIS-DELETES-THE-CALLORA-DATABASE'
          fi
          printf 'PUBLIC_BASE_URL=%s\n' "$PUBLIC_BASE_URL" | "${SSH[@]}" "$REMOTE" 'bash /opt/callora/deploy.sh init-host'

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'deploy' || inputs.mode == 'reset')
    needs: [image, host]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      # Names only here; values come from GitHub Secrets/Variables (see SECRETS.md).
      SERVER_HOST: ${{ secrets.IP }}
      SERVER_USER: ${{ secrets.USER }}
      DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      CALLORA_IMAGE: ${{ vars.DOCKER_HUB_USERNAME }}/callora:${{ github.sha }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      STREAM_TOKEN_SECRET: ${{ secrets.STREAM_TOKEN_SECRET }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_DYNAMIC_MODEL: ${{ vars.ELEVENLABS_DYNAMIC_MODEL }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TEXT_LLM_MODEL: ${{ vars.TEXT_LLM_MODEL }}
      TEXT_LLM_REASONING_EFFORT: ${{ vars.TEXT_LLM_REASONING_EFFORT }}
      TAXI_PHONE_NUMBERS: ${{ vars.TAXI_PHONE_NUMBERS || secrets.TAXI_PHONE_NUMBERS }}
      TAXI_HANDOFF_NUMBER: ${{ vars.TAXI_HANDOFF_NUMBER || secrets.TAXI_HANDOFF_NUMBER }}
      TAXI_DISPATCH_URL: ${{ secrets.TAXI_DISPATCH_URL }}
      TAXI_DISPATCH_TOKEN: ${{ secrets.TAXI_DISPATCH_TOKEN }}
      TAXI_CRM_URL: ${{ secrets.TAXI_CRM_URL }}
      TAXI_CRM_TOKEN: ${{ secrets.TAXI_CRM_TOKEN }}
      ALLOW_LIST: ${{ secrets.ALLOW_LIST }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        run: |
          missing=()
          for name in SERVER_HOST SERVER_USER DOCKER_HUB_USERNAME DOCKER_HUB_TOKEN TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required configuration: ${missing[*]} (SERVER_HOST is the IP secret, SERVER_USER the USER secret)" >&2
            exit 1
          fi
          [[ "$TWILIO_ACCOUNT_SID" =~ ^AC[0-9a-fA-F]{32}$ ]] || { echo 'TWILIO_ACCOUNT_SID is not a valid Account SID' >&2; exit 1; }
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo 'USER is not a valid Linux account name' >&2; exit 1; }
          for name in CARTESIA_API_KEY ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID TAXI_PHONE_NUMBERS; do
            [[ -n "${!name}" ]] || echo "Note: $name is not set; the service runs degraded without it (see SECRETS.md)."
          done
          [[ -n "$GEMINI_API_KEY$OPENAI_API_KEY" ]] || echo 'Note: neither GEMINI_API_KEY nor OPENAI_API_KEY is set; understanding uses rules only.'

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.KEY_PEM }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: deploy/ci-ssh-setup.sh

      - name: Upload and deploy
        run: |
          source "$SSH_DIR/ssh.env"
          REMOTE_DOCKER_CONFIG="/tmp/callora-docker-${GITHUB_SHA}"
          cleanup() {
            "${SSH[@]}" "$REMOTE" "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' docker logout >/dev/null 2>&1 || true; rm -rf -- '$REMOTE_DOCKER_CONFIG'" || true
          }
          trap cleanup EXIT

          "${SSH[@]}" "$REMOTE" 'install -d -m 700 /opt/callora/incoming'
          "${SCP[@]}" docker-compose.prod.yml Caddyfile deploy/deploy.sh "$REMOTE:/opt/callora/incoming/"
          "${SSH[@]}" "$REMOTE" "install -d -m 700 '$REMOTE_DOCKER_CONFIG'"
          printf '%s' "$DOCKER_HUB_TOKEN" | "${SSH[@]}" "$REMOTE" \
            "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' docker login --username '$DOCKER_HUB_USERNAME' --password-stdin >/dev/null"
          "${SSH[@]}" "$REMOTE" 'install -m 0755 /opt/callora/incoming/deploy.sh /opt/callora/deploy.sh'
          "${SSH[@]}" "$REMOTE" 'bash /opt/callora/deploy.sh reclaim' || true

          # Runtime settings travel as NAME=VALUE lines on stdin: never on a command line,
          # never printed. deploy.sh accepts only the names it knows.
          for name in TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN STREAM_TOKEN_SECRET \
                      ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID ELEVENLABS_DYNAMIC_MODEL \
                      CARTESIA_API_KEY OPENAI_API_KEY GEMINI_API_KEY TEXT_LLM_MODEL TEXT_LLM_REASONING_EFFORT \
                      TAXI_PHONE_NUMBERS TAXI_HANDOFF_NUMBER TAXI_DISPATCH_URL TAXI_DISPATCH_TOKEN \
                      TAXI_CRM_URL TAXI_CRM_TOKEN ALLOW_LIST ADMIN_API_KEY; do
            value="${!name}"
            value="${value//$'\n'/}"
            printf '%s=%s\n' "$name" "$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          done | "${SSH[@]}" "$REMOTE" 'bash /opt/callora/deploy.sh update-secrets'

          if ! "${SSH[@]}" "$REMOTE" "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' bash /opt/callora/deploy.sh deploy '$CALLORA_IMAGE'"; then
            echo 'Production deployment failed; the server attempted an automatic rollback.' >&2
            exit 1
          fi
          if ! "${SSH[@]}" "$REMOTE" "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' bash /opt/callora/deploy.sh confirm"; then
            echo 'Release confirmation failed; rolling back.' >&2
            "${SSH[@]}" "$REMOTE" "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' bash /opt/callora/deploy.sh rollback" || true
            exit 1
          fi
