name: Callora CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: callora-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ${{ vars.DOCKER_HUB_USERNAME }}/callora

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment configuration
        env:
          CALLORA_IMAGE: validation/callora:0000000000000000000000000000000000000000
          POSTGRES_USER: callora
          POSTGRES_PASSWORD: validation-only
          POSTGRES_DB: callora
          DATABASE_URL: postgresql://callora:validation-only@db:5432/callora
          TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
          TWILIO_AUTH_TOKEN: validation-only
          PUBLIC_BASE_URL: https://callora.example.invalid
          OPENAI_API_KEY: sk-validation-only-not-a-real-key
        run: |
          pnpm validate:config
          bash -n deploy/deploy.sh deploy/bootstrap-oracle-linux.sh
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  image:
    name: Publish ARM64 image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Docker Hub configuration
        env:
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import re
          import sys

          username = os.environ.get('DOCKER_HUB_USERNAME', '')
          token = os.environ.get('DOCKER_HUB_TOKEN', '')
          if not username:
              print('Missing required GitHub Repository Variable: DOCKER_HUB_USERNAME', file=sys.stderr)
              sys.exit(1)
          if not token:
              print('Missing required GitHub Repository Secret: DOCKER_HUB_TOKEN', file=sys.stderr)
              sys.exit(1)
          if not re.fullmatch(r'[a-z0-9]+(?:[._-][a-z0-9]+)*', username):
              print('DOCKER_HUB_USERNAME is not a valid Docker image namespace.', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate deployment configuration and create bundle
        env:
          SERVER_HOST: ${{ secrets.IP }}
          SERVER_USER: ${{ secrets.USER }}
          SERVER_SSH_KEY: ${{ secrets.KEY_PEM }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELEASE_SHA: ${{ github.sha }}
          CALLORA_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          DEPLOY_BUNDLE_DIR: ${{ runner.temp }}/callora-deploy
        run: |
          python3 <<'PY'
          import ipaddress
          import os
          import pathlib
          import re
          import sys

          required = {
              'SERVER_HOST': 'GitHub Repository Secret IP',
              'SERVER_USER': 'GitHub Repository Secret USER',
              'SERVER_SSH_KEY': 'GitHub Repository Secret KEY_PEM',
              'DOCKER_HUB_TOKEN': 'GitHub Repository Secret DOCKER_HUB_TOKEN',
              'TWILIO_ACCOUNT_SID': 'GitHub Repository Secret TWILIO_ACCOUNT_SID',
              'TWILIO_AUTH_TOKEN': 'GitHub Repository Secret TWILIO_AUTH_TOKEN',
              'OPENAI_API_KEY': 'GitHub Repository Secret OPENAI_API_KEY',
              'DOCKER_HUB_USERNAME': 'GitHub Repository Variable DOCKER_HUB_USERNAME',
          }
          missing = [label for name, label in required.items() if not os.environ.get(name)]
          if missing:
              print(f"Missing required configuration: {', '.join(missing)}", file=sys.stderr)
              sys.exit(1)

          try:
              host = ipaddress.ip_address(os.environ['SERVER_HOST'])
          except ValueError:
              print('IP must contain a valid IPv4 address.', file=sys.stderr)
              sys.exit(1)
          if host.version != 4:
              print('IP must contain a valid IPv4 address.', file=sys.stderr)
              sys.exit(1)

          if not re.fullmatch(r'[a-z_][a-z0-9_-]{0,31}', os.environ['SERVER_USER']):
              print('USER is not a valid Linux account name.', file=sys.stderr)
              sys.exit(1)

          username = os.environ['DOCKER_HUB_USERNAME']
          if not re.fullmatch(r'[a-z0-9]+(?:[._-][a-z0-9]+)*', username):
              print('DOCKER_HUB_USERNAME is not a valid Docker image namespace.', file=sys.stderr)
              sys.exit(1)

          if not re.fullmatch(r'AC[0-9a-fA-F]{32}', os.environ['TWILIO_ACCOUNT_SID']):
              print('TWILIO_ACCOUNT_SID is not a valid Twilio Account SID.', file=sys.stderr)
              sys.exit(1)
          if not re.fullmatch(r'[0-9a-fA-F]{32}', os.environ['TWILIO_AUTH_TOKEN']):
              print('TWILIO_AUTH_TOKEN is not a valid Twilio Auth Token.', file=sys.stderr)
              sys.exit(1)
          openai_api_key = os.environ['OPENAI_API_KEY']
          if openai_api_key != openai_api_key.strip() or any(
              character in openai_api_key for character in ('\r', '\n', '\0')
          ):
              print('OPENAI_API_KEY must be a non-empty, single-line secret without surrounding whitespace.', file=sys.stderr)
              sys.exit(1)

          release_sha = os.environ['RELEASE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', release_sha):
              print('The release identifier must be a full commit SHA.', file=sys.stderr)
              sys.exit(1)
          if os.environ['CALLORA_IMAGE'] != f'{username}/callora:{release_sha}':
              print('The release image does not match DOCKER_HUB_USERNAME and the commit SHA.', file=sys.stderr)
              sys.exit(1)

          bundle = pathlib.Path(os.environ['DEPLOY_BUNDLE_DIR'])
          bundle.mkdir(mode=0o700, parents=True, exist_ok=True)
          PY
          cp docker-compose.prod.yml Caddyfile deploy/deploy.sh "$DEPLOY_BUNDLE_DIR/"

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.IP }}
          SERVER_SSH_KEY: ${{ secrets.KEY_PEM }}
          SSH_DIR: ${{ runner.temp }}/callora-ssh
        run: |
          install -d -m 700 "$SSH_DIR"
          printf '%s\n' "$SERVER_SSH_KEY" > "$SSH_DIR/deploy_key"
          chmod 600 "$SSH_DIR/deploy_key"
          ssh-keyscan -T 10 -H "$SERVER_HOST" > "$SSH_DIR/known_hosts" 2>/dev/null
          test -s "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/known_hosts"

      - name: Upload and deploy
        env:
          SERVER_HOST: ${{ secrets.IP }}
          SERVER_USER: ${{ secrets.USER }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEPLOY_BUNDLE_DIR: ${{ runner.temp }}/callora-deploy
          SSH_DIR: ${{ runner.temp }}/callora-ssh
          CALLORA_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" -i "$SSH_DIR/deploy_key")
          SCP=(scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" -i "$SSH_DIR/deploy_key")
          REMOTE="$SERVER_USER@$SERVER_HOST"
          REMOTE_DOCKER_CONFIG="/tmp/callora-docker-${CALLORA_IMAGE##*:}"

          cleanup() {
            "${SSH[@]}" "$REMOTE" \
              "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' docker logout >/dev/null 2>&1 || true; rm -rf -- '$REMOTE_DOCKER_CONFIG'" || true
          }
          trap cleanup EXIT

          "${SSH[@]}" "$REMOTE" 'install -d -m 700 /opt/callora/incoming'
          "${SCP[@]}" \
            "$DEPLOY_BUNDLE_DIR/docker-compose.prod.yml" \
            "$DEPLOY_BUNDLE_DIR/Caddyfile" \
            "$DEPLOY_BUNDLE_DIR/deploy.sh" \
            "$REMOTE:/opt/callora/incoming/"
          "${SSH[@]}" "$REMOTE" "install -d -m 700 '$REMOTE_DOCKER_CONFIG'"
          printf '%s' "$DOCKER_HUB_TOKEN" | \
            "${SSH[@]}" "$REMOTE" \
              "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' docker login --username '$DOCKER_HUB_USERNAME' --password-stdin >/dev/null"
          "${SSH[@]}" "$REMOTE" 'install -m 0755 /opt/callora/incoming/deploy.sh /opt/callora/deploy.sh'
          printf '%s\n%s\n%s\n' "$TWILIO_ACCOUNT_SID" "$TWILIO_AUTH_TOKEN" "$OPENAI_API_KEY" | \
            "${SSH[@]}" "$REMOTE" 'bash /opt/callora/deploy.sh update-secrets'

          if ! "${SSH[@]}" "$REMOTE" \
            "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' bash /opt/callora/deploy.sh deploy '$CALLORA_IMAGE'"; then
            echo 'Production deployment failed; the server attempted an automatic rollback.' >&2
            exit 1
          fi

          if ! "${SSH[@]}" "$REMOTE" \
            "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' bash /opt/callora/deploy.sh confirm"; then
            echo 'Release confirmation failed; rolling back.' >&2
            "${SSH[@]}" "$REMOTE" \
              "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' bash /opt/callora/deploy.sh rollback" || true
            exit 1
          fi
