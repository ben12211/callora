name: callora

# Nothing rotated container logs before this, and the backend narrates every call turn to
# stdout. On a boot volume this size the logs outgrow the images, and the deployment that
# runs out of room is the one that unpacks the next release. Ten megabytes times three
# files per service keeps a useful amount of history and a bounded amount of disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    logging: *logging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 128mb

  backend:
    image: ${CALLORA_IMAGE:?CALLORA_IMAGE is required}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID is required}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN is required}
      STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:-}
      # Speech: Deepgram Nova-3 hears (Scribe or Cartesia with STT_PROVIDER=scribe|cartesia),
      # ElevenLabs speaks (library + dynamic), the LLMs only help understanding. Each one
      # missing degrades the service instead of stopping it.
      STT_PROVIDER: ${STT_PROVIDER:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_STT_MODEL: ${DEEPGRAM_STT_MODEL:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      CARTESIA_STT_MODEL: ${CARTESIA_STT_MODEL:-}
      CARTESIA_VERSION: ${CARTESIA_VERSION:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_API_BASE_URL: ${ELEVENLABS_API_BASE_URL:-https://api.elevenlabs.io}
      ELEVENLABS_DYNAMIC_MODEL: ${ELEVENLABS_DYNAMIC_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL:-}
      TEXT_LLM_REASONING_EFFORT: ${TEXT_LLM_REASONING_EFFORT:-}
      TEXT_LLM_BASE_URL: ${TEXT_LLM_BASE_URL:-}
      # The conversation agent (businesses with an `agent` block); unset uses the defaults.
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_BACKUP_MODEL: ${AGENT_BACKUP_MODEL:-}
      AGENT_FALLBACK_MODEL: ${AGENT_FALLBACK_MODEL:-}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-}
      AGENT_HEDGE_MS: ${AGENT_HEDGE_MS:-}
      # Token prices for the cost per call on /calls ("gpt-6-sol=2/0.2/10,...").
      AGENT_PRICES: ${AGENT_PRICES:-}
      AGENT_SPECULATE: ${AGENT_SPECULATE:-}
      # Turn-taking tuning; unset uses the built-in defaults.
      VAD_ENDPOINT_MS: ${VAD_ENDPOINT_MS:-}
      VAD_TRIGGER_MS: ${VAD_TRIGGER_MS:-}
      # The taxi business (businesses/taxi.json reads these by name).
      TAXI_PHONE_NUMBERS: ${TAXI_PHONE_NUMBERS:-}
      TAXI_HANDOFF_NUMBER: ${TAXI_HANDOFF_NUMBER:-}
      TAXI_DISPATCH_URL: ${TAXI_DISPATCH_URL:-}
      TAXI_DISPATCH_TOKEN: ${TAXI_DISPATCH_TOKEN:-}
      TAXI_CRM_URL: ${TAXI_CRM_URL:-}
      TAXI_CRM_TOKEN: ${TAXI_CRM_TOKEN:-}
      ALLOW_LIST: ${ALLOW_LIST:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # The dashboard's password; unset, the default 12345678.
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      AUDIO_SAMPLE_NUMBERS: ${AUDIO_SAMPLE_NUMBERS:-}
      TRANSCRIPT_RETENTION_DAYS: ${TRANSCRIPT_RETENTION_DAYS:-30}
      AUDIO_LIBRARY_DIR: /data/voice-library
      # The WhatsApp service, over its own network; no token, no WhatsApp page.
      WHATSAPP_URL: http://whatsapp:3100
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
    logging: *logging
    volumes:
      # Generated once per voice with `callora voice-library build` (see DEPLOYMENT.md).
      - voice_library:/data/voice-library
    expose:
      - "3000"
    networks:
      - database
      - web
      - whatsapp
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/callora", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # Long enough for calls in progress to finish their current reply.
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

  # WhatsApp accounts (whatsapp-web.js with Chromium), signed in by QR from the dashboard.
  # Only the backend reaches it; its logins live on the whatsapp_data volume.
  whatsapp:
    image: ${WHATSAPP_IMAGE:-whatsapp-image-not-set}
    environment:
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      MAX_SESSIONS: ${WHATSAPP_MAX_SESSIONS:-5}
    logging: *logging
    volumes:
      - whatsapp_data:/data
    networks:
      - whatsapp
    # Chromium needs a real /dev/shm; each account is a browser of its own.
    shm_size: 1gb
    mem_limit: 3g
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  postgres_data:
    name: callora_postgres_data
  caddy_data:
    name: callora_caddy_data
  caddy_config:
    name: callora_caddy_config
  voice_library:
    name: callora_voice_library
  whatsapp_data:
    name: callora_whatsapp_data

networks:
  database:
    internal: true
  # The WhatsApp service reaches WhatsApp's servers; the backend reaches it.
  whatsapp:
  web:
