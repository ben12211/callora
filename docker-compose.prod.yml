name: callora

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 128mb

  backend:
    image: ${CALLORA_IMAGE:?CALLORA_IMAGE is required}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID is required}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      # Default provider for newly created agents; each business then picks its own in
      # the dashboard. Credentials for every provider are passed through optionally, and
      # a provider becomes selectable once its own credentials are present.
      VOICE_PROVIDER: ${VOICE_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      # Optional; the application defaults to the public API origin when this is empty.
      ELEVENLABS_API_BASE_URL: ${ELEVENLABS_API_BASE_URL:-https://api.elevenlabs.io}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      CARTESIA_VOICE_ID: ${CARTESIA_VOICE_ID:-}
      # Model ids and the API version are the values most likely to be retired upstream,
      # so they are overridable without shipping code.
      CARTESIA_TTS_MODEL: ${CARTESIA_TTS_MODEL:-}
      CARTESIA_STT_MODEL: ${CARTESIA_STT_MODEL:-}
      CARTESIA_VERSION: ${CARTESIA_VERSION:-}
      # Cartesia covers speech only; the reasoning turn runs on an OpenAI text model.
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL:-}
      TEXT_LLM_BASE_URL: ${TEXT_LLM_BASE_URL:-}
      # Control plane. ADMIN_EMAIL and ADMIN_PASSWORD create the dashboard administrator
      # and reset its password whenever the value changes; leaving both empty keeps
      # whatever account already exists. ADMIN_API_KEY is the optional machine credential
      # for the management API.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # Optional caller allowlist; empty or unset allows every caller.
      ALLOW_LIST: ${ALLOW_LIST:-}
      DB_STARTUP_RETRIES: 30
      DB_STARTUP_RETRY_DELAY_SECONDS: 2
    expose:
      - "3000"
    networks:
      - database
      - web
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
    name: callora_postgres_data
  caddy_data:
    name: callora_caddy_data
  caddy_config:
    name: callora_caddy_config

networks:
  database:
    internal: true
  web:
