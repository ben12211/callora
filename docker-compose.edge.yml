name: callora

# The VM's HTTPS edge, outside minikube: Callora runs in the cluster (deploy/k8s), and this
# Caddy also serves the VM's other sites on plain HTTP, so it stays in Docker. It joins the
# `minikube` Docker network and reaches the backend's NodePort (CALLORA_UPSTREAM, written by
# deploy/k8s-deploy.sh from `minikube ip`). Same project, container and volumes as before:
# the certificates are kept.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      CALLORA_UPSTREAM: ${CALLORA_UPSTREAM:?CALLORA_UPSTREAM is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - minikube
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  caddy_data:
    name: callora_caddy_data
  caddy_config:
    name: callora_caddy_config

networks:
  minikube:
    external: true
    name: minikube
