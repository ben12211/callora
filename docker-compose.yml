services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-continue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-continue}
      POSTGRES_DB: ${POSTGRES_DB:-continue}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-continue}:${POSTGRES_PASSWORD:-continue}@db:5432/${POSTGRES_DB:-continue}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
