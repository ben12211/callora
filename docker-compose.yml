# Local development stack. Everything runs in containers: a clean machine needs only
# Docker. Use the `./dev` wrapper rather than calling this file directly.
#
#   ./dev test         cargo test for the whole workspace (with a real Postgres)
#   ./dev check        fmt --check + clippy -D warnings + test
#   ./dev up           Postgres + the Callora server on http://localhost:3000
#   ./dev cargo ...    any cargo command inside the toolchain container
#   ./dev callora ...  the Callora CLI (config validate, simulate, voice-library build)
#
# Build output and the cargo registry live in named volumes, never on the host.

name: callora-dev

x-toolchain: &toolchain
  image: callora-dev-toolchain:1.94
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  working_dir: /workspace
  volumes:
    - .:/workspace
    - cargo_registry:/usr/local/cargo/registry
    - cargo_git:/usr/local/cargo/git
    - target:/workspace/target
  environment:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: "1"
    DATABASE_URL: postgresql://callora:callora@db:5432/callora
    TEST_DATABASE_URL: postgresql://callora:callora@db:5432/callora
  env_file:
    - path: .env
      required: false

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callora
      POSTGRES_PASSWORD: callora
      POSTGRES_DB: callora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callora -d callora"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-off toolchain container: `./dev cargo test`, `./dev callora simulate`, ...
  toolchain:
    <<: *toolchain
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy

  # The server itself, rebuilt from source on start.
  app:
    <<: *toolchain
    command: ["cargo", "run", "--bin", "callora", "--", "serve"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      CARGO_TERM_COLOR: always
      RUST_LOG: ${RUST_LOG:-info,callora=debug}
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://callora:callora@db:5432/callora
      BUSINESS_CONFIG_DIR: /workspace/businesses
      AUDIO_LIBRARY_DIR: /workspace/target/voice-library
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  cargo_registry:
  cargo_git:
  target:
